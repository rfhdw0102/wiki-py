name: llm-wiki-agent

services:
  postgres:
    image: ${PARADEDB_IMAGE:-paradedb/paradedb:latest}
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: wiki
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki -d wiki"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: llm-wiki-agent-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      WIKI_AGENT_AUTO_CREATE_SCHEMA: "false"
      WIKI_AGENT_CORS_ORIGINS: "http://localhost:3000,http://localhost:3002,http://localhost:3003"
      WIKI_AGENT_BROWSER_SERVICE_URL: "http://browser:8080"
    command:
      - /bin/sh
      - -c
      - cd /app/apps/api && alembic upgrade head && uvicorn wiki_agent.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./knowledge:/app/knowledge
      - ./storage:/app/storage
    ports:
      - "8000:8000"
      - "8002:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      browser:
        condition: service_healthy

  worker:
    image: llm-wiki-agent-api:latest
    env_file: .env
    environment:
      WIKI_AGENT_AUTO_CREATE_SCHEMA: "false"
      WIKI_AGENT_BROWSER_SERVICE_URL: "http://browser:8080"
    command:
      [
        "celery",
        "-A",
        "wiki_agent.worker:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=default",
      ]
    volumes:
      - ./knowledge:/app/knowledge
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      browser:
        condition: service_healthy

  browser:
    build:
      context: ./services/browser-service
    environment:
      WIKI_AGENT_SECRET_KEY: ${WIKI_AGENT_SECRET_KEY:-development-only-secret-key-change-me}
      WIKI_AGENT_ENV: ${WIKI_AGENT_ENV:-development}
    init: true
    expose:
      - "8080"
    shm_size: "256mb"
    mem_limit: "1g"
    cpus: 1.0
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  parser-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        UV_SYNC_EXTRAS: "--extra document-parsing"
    env_file: .env
    environment:
      WIKI_AGENT_AUTO_CREATE_SCHEMA: "false"
    command:
      [
        "celery",
        "-A",
        "wiki_agent.worker:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=parser",
        "--concurrency=1",
      ]
    volumes:
      - ./knowledge:/app/knowledge
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  user-web:
    build:
      context: .
      dockerfile: apps/user-web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  redis-data:
