name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --package llm-wiki-agent-api --group dev
      - run: uv run --package llm-wiki-agent-api ruff check apps/api
      - run: uv run --package llm-wiki-agent-api mypy --config-file apps/api/pyproject.toml apps/api/src/wiki_agent
      - run: uv run --package llm-wiki-agent-api pytest
      - name: Validate PostgreSQL migration SQL
        working-directory: apps/api
        env:
          WIKI_AGENT_DATABASE_URL: postgresql+psycopg://wiki:wiki@localhost/wiki
        run: ../../.venv/bin/alembic upgrade head --sql > /tmp/wiki-agent-migration.sql

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:web
      - run: pnpm build:web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
